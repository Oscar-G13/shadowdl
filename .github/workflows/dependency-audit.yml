name: Dependency security audit
on:
  push:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/requirements*'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Audit committed dependency graph
        working-directory: .
        run: npm audit --package-lock-only
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install audit tools
        run: python -m pip install 'pip-audit==2.10.1' 'uv==0.13.9'
      - name: Audit complete pinned Python graph
        working-directory: backend
        run: pip-audit --disable-pip --no-deps -r requirements.txt
